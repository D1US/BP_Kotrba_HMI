<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLC Log HMI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>PLC Log Monitor</h1>

  <section class="panel">
    <div class="panel-header">
      <h2>Live Log</h2>
      <div class="buttons">
        <button id="jumpBtn" style="display:none;">Jump to latest</button>
        <button id="clearBtn">Clear Log</button>
      </div>
    </div>
    <pre id="logView">(waiting for log...)</pre>
  </section>

  <section class="panel">
    <h2>Save File for PLC</h2>
    <div id="dropZone" class="drop-zone">
      Drag &amp; drop a file here, or click to choose
      <input type="file" id="fileInput" hidden>
    </div>
    <div id="selectedFileName" class="file-name"></div>
    <button id="saveBtn" disabled>Save</button>
    <div id="saveStatus" class="status"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
